services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avighnya
      POSTGRES_PASSWORD: avighnya
      POSTGRES_DB: avighnya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avighnya -d avighnya"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://avighnya:avighnya@db:5432/avighnya
      SECRET_KEY: change-me-in-production-avighnya-foods-secret
      CORS_ORIGINS: http://localhost:3000
      SEED_DEMO_TRANSACTIONS: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
