# Render Blueprint — use branch `main` on chethud/Avignafood2
# Dashboard: New → Blueprint → connect repo → apply

databases:
  - name: avighna-db
    plan: free
    databaseName: avighnya
    user: avighnya

services:
  - type: web
    name: avighna-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: avighna-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:3001,https://avignafood2.vercel.app"
