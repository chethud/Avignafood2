# Render Blueprint — API + Postgres for Avighna Foods demo
# Dashboard: New → Blueprint → connect this repo
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: avighna-db
    plan: free
    databaseName: avighnya
    user: avighnya

services:
  - type: web
    name: avighna-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: avighna-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        # Set after Vercel deploy, e.g. https://avignafood.vercel.app
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"
